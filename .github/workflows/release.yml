name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package from tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 12.16.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Assert tagged source and version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "::error::release must be triggered by a tag, got ${REF_TYPE}"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          if [ "${head}" != "${EVENT_SHA}" ]; then
            echo "::error::checked out ${head}, but tag ${REF_NAME} resolves to ${EVENT_SHA}"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${REF_NAME}" ]; then
            echo "::error::tag ${REF_NAME} does not match package version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${EVENT_SHA}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --only-shell --with-deps chromium
      - run: pnpm verify
      - run: pnpm test:browser
      - run: pnpm release:pack

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dsh-plan-execute-package
          path: |
            .release/*.tgz
            .release/*.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  publish:
    name: Create draft from this tag's package
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dsh-plan-execute-package
          path: release

      - name: Verify release assets
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(./*.tgz)
          checksums=(./*.sha256)
          if [ "${#tarballs[@]}" -ne 1 ] || [ "${#checksums[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball and one checksum file"
            exit 1
          fi
          sha256sum -c "${checksums[0]}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          EXPECTED_SHA: ${{ needs.package.outputs.commit }}
        run: |
          set -euo pipefail
          remote_sha=$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)
          if [ "${remote_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::tag ${TAG} now resolves to ${remote_sha}, expected ${EXPECTED_SHA}"
            exit 1
          fi
          shopt -s nullglob
          tarballs=(release/*.tgz)
          checksums=(release/*.sha256)
          if [ "${#tarballs[@]}" -ne 1 ] || [ "${#checksums[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball and one checksum file"
            exit 1
          fi
          asset=$(basename "${tarballs[0]}")
          checksum=$(basename "${checksums[0]}")
          url="https://github.com/${REPO}/releases/download/${TAG}/${asset}"
          {
            echo "dsh-plan-execute ${VERSION}"
            echo
            echo "Requires DSH 0.2.1-rc.5. This project is MIT licensed."
            echo "The package is intentionally not published to npm."
            echo
            echo "> This is a draft release. GitHub download URLs are not available until it is published."
            echo
            echo "After publishing, verify the downloaded package before installation:"
            echo
            echo '```sh'
            echo "curl -fLO ${url}"
            echo "curl -fLO ${url}.sha256"
            echo "sha256sum -c ${checksum}"
            echo '```'
          } > notes.md
          gh release create "${TAG}" "${tarballs[0]}" "${checksums[0]}" \
            --draft --verify-tag --title "${TAG}" --notes-file notes.md --repo "${REPO}"
